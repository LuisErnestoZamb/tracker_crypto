[package]
name = "tracker_crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
diesel = { version = "2.3", features = ["sqlite", "r2d2"] }
diesel-async = { version = "0.7", features = ["sqlite", "bb8", "async-connection-wrapper"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
governor = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
